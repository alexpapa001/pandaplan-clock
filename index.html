<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PandaPlan 香港日期與時鐘</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,"PingFang HK","Noto Sans TC",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:transparent;overflow:hidden}
.clock{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:18px;row-gap:3px;padding:8px 4px;color:var(--text,#27232a)}
.date{font-size:clamp(19px,3.6vw,30px);font-weight:700;letter-spacing:.035em;white-space:nowrap}
.time{font-size:clamp(19px,3.6vw,30px);font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:.035em;white-space:nowrap}
.zone{font-size:12px;opacity:.58;font-weight:500;margin-left:4px}
@media(prefers-color-scheme:dark){.clock{--text:#f2eef4}}
@media(max-width:380px){.clock{column-gap:12px}.zone{display:none}}
</style>
</head>
<body>
<div class="clock" role="timer" aria-label="香港日期及即時時間">
 <span id="date" class="date">載入日期中…</span>
 <span><span id="time" class="time">--:--:--</span><span class="zone">HKT</span></span>
</div>
<script>
(()=>{
 const dateEl=document.getElementById('date');
 const timeEl=document.getElementById('time');
 const weekdays=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
 const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
 function update(){
  const p=Object.fromEntries(parts.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
  const weekday=new Date(Date.UTC(+p.year,+p.month-1,+p.day)).getUTCDay();
  dateEl.textContent=`${+p.month} 月 ${+p.day} 日（${weekdays[weekday]}）`;
  timeEl.textContent=`${p.hour}:${p.minute}:${p.second}`;
 }
 update();setInterval(update,250);
})();
</script>
</body>
</html>
