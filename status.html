<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PandaPlan 更新狀態</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang HK',sans-serif}
body{margin:0;background:transparent;color:#f2f2f2}
.panel{background:#191919;border:1px solid #383838;border-radius:12px;padding:18px}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:#aaa;font-size:13px}
.refresh{appearance:none;background:#292929;border:1px solid #4b4b4b;border-radius:7px;color:inherit;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap}
.refresh:hover{background:#383838}
.refresh:focus-visible{outline:2px solid #87b7ff;outline-offset:2px}
.refresh:disabled{opacity:.6;cursor:wait}
.status{font-size:22px;font-weight:700;margin:10px 0}
.note{line-height:1.55;font-size:14px}
.note-section{font-weight:700;margin:14px 0 7px}
.note-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start;margin:5px 0}
.note-item-name{min-width:0;overflow-wrap:anywhere}
.note-item-days{white-space:nowrap;color:#e6a34b;font-variant-numeric:tabular-nums}
.note-info{margin:10px 0;color:#bdbdbd;overflow-wrap:anywhere}
.note-intro{margin:4px 0 10px;color:#bbb}
.note-line{display:block;margin:0 0 8px 0;white-space:normal;overflow-wrap:anywhere}
.note-line:last-child{margin-bottom:0}
.note-quip{margin:7px 0 9px;line-height:1.5;font-size:.93em;opacity:.9}
.note-line.warning-line{padding-left:1.4em;text-indent:-1.4em}
small{display:block;margin-top:12px;color:#aaa;line-height:1.5;overflow-wrap:anywhere}
@media(prefers-color-scheme:light){body{color:#222}.panel{background:white;border-color:#ddd}.muted,small{color:#666}.refresh{background:#f7f7f7;border-color:#ccc}.refresh:hover{background:#eee}}
#note{white-space:pre-line;overflow-wrap:anywhere;}
</style>
</head>
<body>
<main class="panel">
  <div class="header">
    <div class="muted">🐼 PandaPlan 更新狀態</div>
    <button class="refresh" type="button" id="refresh" aria-label="重新整理 PandaPlan 狀態">↻ 重新整理</button>
  </div>
  <div class="status" id="state" role="status" aria-live="polite">正在讀取…</div>
  <div class="note" id="note">請稍候。</div>
  <small id="meta"></small>
</main>
<script>
(()=>{
  'use strict';
  const states={running:'⏳ 正在更新',preview:'ℹ️ 測試完成・預覽模式',success:'✅ 更新完成',warning:'⚠️ 更新完成・有提示',blocked:'⚠️ 排程未套用',failed:'❌ 更新失敗'};
  const state=document.getElementById('state');
  const note=document.getElementById('note');
  const meta=document.getElementById('meta');
  function localTime(value){
    if(!value)return '未知';
    const d=new Date(value);
    if(Number.isNaN(d.getTime()))return String(value);
    return new Intl.DateTimeFormat('zh-HK',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d).replace(/\//g,'/')+' HKT';
  }

  const button=document.getElementById('refresh');
  const pandaQuotes=[
    '🐼 別睡了！少睡 X 天就趕得上了!!',
    '🐼 好消息！只需要犧牲 X 天睡眠！',
    '🐼 你的截稿日和睡眠，只能留一個。',
    '🐼 只要少睡 X 天，一切都還有希望！',
    '🐼 截稿日正在追殺你，睡眠先放一邊！',
    '🐼 目前距離奇蹟，只差 X 天的睡眠。',
    '🐼 睡覺可以補，截稿日不會等！',
    '🐼 少睡 X 天就能準時？數學說可以。',
    '🐼 你與準時交稿之間，隔着 X 天的美夢。',
    '🐼 目前有 N 項任務在後面追你，跑快點！',
    '🐼 N 項任務已經組成追擊小隊。',
    '🐼 你以為今天很忙？N 項任務說還沒開始呢。',
    '🐼 截稿日沒有腳，卻比你跑得快。',
    '🐼 待辦清單正在繁殖，請勿餵食。',
    '🐼 你的行事曆正在向你發出求救訊號。',
    '🐼 N 項任務排隊敲門，請問要先救哪一個？',
    '🐼 截稿日不是都市傳說，它真的會來。',
    '🐼 目前進度：熊貓冷靜，行事曆不冷靜。',
    '🐼 你和自由之間，還隔着 N 項任務。',
  ];
  const pandaDailyQuotes=[
    "🐼 記得喝水，熊貓不想你變成風乾竹筍。",
    "🐼 今天也辛苦了，先喝一口水吧！",
    "🐼 工作可以慢慢做，水要記得喝。",
    "🐼 坐太久了！起來伸個懶腰吧。",
    "🐼 眼睛也要休息，看看遠方的竹林。",
    "🐼 今天的你也有好好努力，熊貓批准休息五分鐘。",
    "🐼 沒有警告？很好，來獎勵自己一杯水。",
    "🐼 記得吃飯，靈感不能當主食。",
    "🐼 先整理一下桌面，說不定會找到失蹤的靈感。",
    "🐼 今天也要善待手腕，畫圖記得活動一下。",
    "🐼 你的待辦清單今天很乖，拍拍牠。",
    "🐼 不用每分鐘都有效率，熊貓也會發呆。",
    "🐼 好消息！目前沒有任務在追殺你。",
    "🐼 趁世界和平，去泡杯喜歡的飲品吧。",
    "🐼 沒有警告的日子，適合摸一下魚。",
    "🐼 記得眨眼，螢幕不會跑掉的。"
];
  // A full page load or manual refresh picks a new quote. Background polling keeps it.
  // Give numeric sleep jokes a modest boost: 45% when the hour estimate exists.
  const sleepQuotes=pandaQuotes.filter(q=>q.includes('X'));
  const otherQuotes=pandaQuotes.filter(q=>!q.includes('X'));
  let selectedLate=null;
  let selectedDaily=null;
  function randomOtherThan(items, previous){
    const pool=items.length>1?items.filter(q=>q!==previous):items;
    return pool[Math.floor(Math.random()*pool.length)];
  }
  function chooseQuotes(sleepDays){
    const previousLate=selectedLate;
    const available=sleepDays?pandaQuotes:otherQuotes;
    const preferSleep=Boolean(sleepDays)&&Math.random()<0.45;
    const preferred=preferSleep?sleepQuotes:otherQuotes;
    const pool=preferred.filter(q=>q!==previousLate);
    selectedLate=randomOtherThan(pool.length?pool:available,previousLate);
    selectedDaily=randomOtherThan(pandaDailyQuotes,selectedDaily);
  }
  let busy=false;
  function showMessage(message, reroll=false){
    const lines=String(message||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    note.replaceChildren();
    let inLate=false;
    let lateCount=0;
    let quipShown=false;
    const sleepMatch=lines.join('\n').match(/🐼\s*睡眠換算[：:]\s*(\d+(?:\.\d+)?)\s*天/);
    const sleepDays=sleepMatch?sleepMatch[1]:null;
    if(reroll||selectedLate===null)chooseQuotes(sleepDays);
    // If a fresh status has no numeric estimate, avoid unresolved X placeholders.
    if(!sleepDays&&selectedLate.includes('X'))selectedLate=randomOtherThan(otherQuotes,selectedLate);
    const pickedQuote=selectedLate;
    function add(cls,value){const el=document.createElement('div');el.className=cls;el.textContent=value;note.appendChild(el);return el;}
    for(const line of lines){
      if(/^⚠️\s*預計逾期[：:]\s*\d+\s*項/.test(line)){
        add('note-section',line);inLate=true;
        lateCount=Number((line.match(/(\d+)\s*項/)||[])[1]||0);
        add('note-quip',pickedQuote.replaceAll('X',sleepDays||'？').replaceAll('N',String(lateCount)));
        quipShown=true;
        continue;
      }
      if(inLate && line.startsWith('🐼 ')){
        // Metadata only; the quote has already been inserted below the heading.
        continue;
      }
      const late=inLate && line.match(/^(.*?)\s+(\d+)\s*天$/);
      if(late){
        const row=document.createElement('div');row.className='note-item';
        const name=document.createElement('span');name.className='note-item-name';name.textContent=late[1];
        const days=document.createElement('span');days.className='note-item-days';days.textContent=late[2]+' 天';
        row.append(name,days);note.appendChild(row);continue;
      }
      inLate=false;
      if(line==='排程更新完成。'||line.startsWith('測試完成（預覽模式）')){
        // The status title already communicates success; only show preview explanation.
        if(line.startsWith('測試完成'))add('note-intro',line);
      }else if(line.startsWith('工作日曆已自動補建')){
        add('note-info','✓ '+line);
      }else{
        add('note-line'+(line.startsWith('⚠️')?' warning-line':''),line);
      }
    }
    // Only show everyday encouragement when the update succeeded with no warnings.
    // Preview, errors and real warning messages must not be disguised as all-clear.
    const isSuccess=state.textContent.includes('完成') && !state.textContent.includes('預覽');
    const hasWarnings=lines.some(line=>line.startsWith('⚠️'));
    if(isSuccess && !hasWarnings){
      add('note-quip',selectedDaily);
    }
    if(!note.children.length)add('note-info','沒有排程警告');
  }
  async function refresh(reroll=false){
    if(busy)return;
    busy=true;
    button.disabled=true;
    button.textContent='↻ 讀取中…';
    try{
      const r=await fetch('./pandaplan-status.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      if(d.schema_version!==1||!Object.prototype.hasOwnProperty.call(states,d.state))throw new Error('Invalid status');
      state.textContent=states[d.state];
      showMessage(d.message,reroll);
      meta.textContent='最後更新：'+localTime(d.updated_at);
    }catch(e){
      state.textContent='尚未取得更新狀態';
      note.textContent='無法讀取最新狀態，請稍後再試。';
      meta.textContent='';
    }finally{
      busy=false;
      button.disabled=false;
      button.textContent='↻ 重新整理';
    }
  }
  button.addEventListener('click',()=>refresh(true));
  refresh(true);
  setInterval(()=>refresh(false),10000);
})();
</script>
</body>
</html>
