<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PandaPlan 今日工時</title>
<style>
:root{color-scheme:dark;--bg:#191919;--fg:#f3f3f3;--muted:#a4a4a4;--line:#383838;--accent:#e98eb2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC",sans-serif}
main{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:3px}
.card{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:17px 19px}
.label{font-size:clamp(12px,1.25vw,17px);color:var(--muted);font-weight:600;white-space:nowrap}
.value{margin-top:8px;font-size:clamp(28px,4vw,64px);font-weight:750;font-variant-numeric:tabular-nums;letter-spacing:-.045em;line-height:1.15}
.unit{font-size:.32em;font-weight:500;letter-spacing:0;margin-left:.25em;color:var(--muted)}
.card:last-child .value{color:var(--accent)}
footer{padding:5px 5px 0;font-size:11px;color:var(--muted)}
@media(max-width:440px){main{gap:6px}.card{padding:12px 8px;border-radius:9px}.label{font-size:11px}.value{font-size:clamp(22px,7vw,40px)}}
@media(prefers-color-scheme:light){:root{--bg:#fff;--fg:#222;--muted:#666;--line:#ddd;--accent:#b52e69}}
</style></head>
<body><main aria-label="今日工時概覽">
<section class="card"><div class="label">今日可用工時</div><div class="value"><span id="available">—</span><span class="unit">h</span></div></section>
<section class="card"><div class="label">已安排工時</div><div class="value"><span id="scheduled">—</span><span class="unit">h</span></div></section>
<section class="card"><div class="label">剩餘工時</div><div class="value"><span id="remaining">—</span><span class="unit">h</span></div></section>
</main><footer id="status" aria-live="polite">正在讀取工時…</footer>
<script>
(()=>{'use strict';
const el=id=>document.getElementById(id);
const dayFmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Hong_Kong',year:'numeric',month:'2-digit',day:'2-digit'});
function hkDate(){const p=Object.fromEntries(dayFmt.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));const now=new Date();const hr=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Hong_Kong',hour:'2-digit',hourCycle:'h23'}).format(now));const d=new Date(Date.UTC(+p.year,+p.month-1,+p.day));if(hr<5)d.setUTCDate(d.getUTCDate()-1);return d.toISOString().slice(0,10)}
function fmt(v){return Number(v).toLocaleString('en-US',{maximumFractionDigits:2})}
async function refresh(){try{const r=await fetch('./dashboard-hours.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.schema_version!==1||!/^\d{4}-\d{2}-\d{2}$/.test(d.date)||['available_hours','scheduled_hours','remaining_hours'].some(k=>typeof d[k]!=='number'||!Number.isFinite(d[k])||d[k]<0))throw Error('invalid data');
el('available').textContent=fmt(d.available_hours);el('scheduled').textContent=fmt(d.scheduled_hours);el('remaining').textContent=fmt(d.remaining_hours);
const current=d.date===hkDate();el('status').textContent=(current?'':'資料日期不同於目前工作日 · ')+d.date+' · 最後同步 '+(d.updated_at||'未提供');
}catch(e){el('status').textContent='工時資料暫時無法更新，請檢查同步狀態';}}
refresh();setInterval(refresh,5*60*1000);
})();
</script></body></html>
