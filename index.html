<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PandaPlan 香港日期與即時時鐘</title>
<style>
:root { color-scheme: dark light; font-family: system-ui,-apple-system,"PingFang HK","Noto Sans TC",sans-serif; }
* { box-sizing: border-box; }
html,body { margin:0; padding:0; width:100%; background:transparent; overflow:hidden; }
body { color:#25232a; }
@media (prefers-color-scheme:dark) { body { color:#f5f3f6; } }
#clock { display:flex; align-items:baseline; justify-content:space-between; gap:0.35em; width:100%; padding:2px 5px 4px 0; white-space:nowrap; line-height:1.22; font-size:28px; font-weight:750; letter-spacing:.01em; }
#date,#timewrap { flex:none; white-space:nowrap; }
#time { font-variant-numeric:tabular-nums; }
#zone { font-size:.32em; font-weight:600; opacity:.65; margin-left:.35em; vertical-align:baseline; }
</style>
</head>
<body>
<div id="clock" role="timer" aria-label="香港日期及即時時間">
  <span id="date">載入日期中…</span>
  <span id="timewrap"><span id="time">00:00:00</span><span id="zone">HKT</span></span>
</div>
<script>
(() => {
  'use strict';
  const clock=document.getElementById('clock');
  const dateEl=document.getElementById('date');
  const timeEl=document.getElementById('time');
  const days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const fmt=new Intl.DateTimeFormat('en-GB',{
    timeZone:'Asia/Hong_Kong',year:'numeric',month:'numeric',day:'numeric',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
  });
  function fit(){
    // Actual text measurement: expand until date + time occupy almost all available width.
    const available=Math.max(0,document.documentElement.clientWidth-8);
    let lo=12,hi=180;
    for(let i=0;i<12;i++){
      const mid=(lo+hi)/2;
      clock.style.fontSize=mid+'px';
      if(clock.scrollWidth<=available) lo=mid; else hi=mid;
    }
    clock.style.fontSize=Math.max(12,lo-1)+'px';
  }
  function update(){
    const p=Object.fromEntries(fmt.formatToParts(new Date())
      .filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));
    const weekday=new Date(Date.UTC(+p.year,+p.month-1,+p.day)).getUTCDay();
    dateEl.textContent=`${+p.month} 月 ${+p.day} 日（${days[weekday]}）`;
    timeEl.textContent=`${p.hour}:${p.minute}:${p.second}`;
    fit();
  }
  update();
  window.addEventListener('resize',fit,{passive:true});
  if('ResizeObserver' in window) new ResizeObserver(fit).observe(document.documentElement);
  setInterval(update,1000);
})();
</script>
</body>
</html>
