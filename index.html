<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>PandaPlan 香港日期及時間</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; width:100%; min-height:0; overflow:hidden; background:transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang HK", "Microsoft JhengHei", sans-serif; color:#f7f7f7; }
  #clock { display:flex; align-items:baseline; justify-content:flex-start; gap:.65em; white-space:nowrap; width:max-content; max-width:none; font-weight:750; line-height:1.25; font-variant-numeric:tabular-nums; letter-spacing:.005em; }
  #date, #time { white-space:nowrap; }
  #tz { font-size:.31em; font-weight:550; opacity:.65; margin-left:.25em; vertical-align:baseline; }
  @media (prefers-color-scheme:light) { body { color:#171717; } }
</style>
</head>
<body>
<div id="clock" aria-label="香港即時日期及時間"><span id="date"></span><span id="time"></span></div>
<script>
(() => {
  'use strict';
  const root = document.getElementById('clock');
  const dateEl = document.getElementById('date');
  const timeEl = document.getElementById('time');
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const dateFormatter = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Hong_Kong', year:'numeric', month:'numeric', day:'numeric', weekday:'short' });
  const timeFormatter = new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Hong_Kong', hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23' });
  let lastDate = '', lastTime = '';
  let resizing = false;
  function fit() {
    if (resizing) return;
    resizing = true;
    // Measure the real rendered text at a known font size; no fixed max-font limit.
    root.style.fontSize = '32px';
    const naturalWidth = root.getBoundingClientRect().width;
    const availableWidth = Math.max(100, document.documentElement.clientWidth - 8);
    const fontSize = naturalWidth > 0 ? 32 * availableWidth / naturalWidth : 32;
    root.style.fontSize = Math.max(12, Math.min(fontSize, 240)).toFixed(2) + 'px';
    resizing = false;
  }
  function update() {
    const now = new Date();
    const parts = Object.fromEntries(dateFormatter.formatToParts(now).filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
    const weekdayIndex = new Date(Date.UTC(Number(parts.year), Number(parts.month)-1, Number(parts.day))).getUTCDay();
    const dateText = `${Number(parts.month)} 月 ${Number(parts.day)} 日（${weekdays[weekdayIndex]}）`;
    const timeText = timeFormatter.format(now);
    if (dateText !== lastDate || timeText !== lastTime) {
      dateEl.textContent = dateText;
      timeEl.textContent = timeText;
      if (dateText !== lastDate) fit();
      lastDate = dateText;
      lastTime = timeText;
    }
  }
  update();
  window.addEventListener('resize', fit, {passive:true});
  if ('ResizeObserver' in window) new ResizeObserver(fit).observe(document.documentElement);
  setInterval(update, 250);
  document.fonts?.ready.then(fit);
})();
</script>
</body>
</html>
