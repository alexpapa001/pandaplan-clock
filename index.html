<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PandaPlan 香港日期及即時時間</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; background: transparent; overflow: hidden; }
  body { color: #f5f5f5; font-family: -apple-system, BlinkMacSystemFont, "PingFang HK", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  #clock { display: block; width: 100%; margin: 0; padding: 0; white-space: nowrap; font-weight: 750; line-height: 1.2; letter-spacing: 0; font-variant-numeric: tabular-nums; }
  #clock-text { display: inline; }
  #zone { display: inline; font-size: .28em; font-weight: 500; opacity: .65; margin-left: .45em; }
  @media (prefers-color-scheme: light) { body { color: #171717; } }
</style>
</head>
<body>
<div id="clock" aria-label="香港即時日期及時間"><span id="clock-text">載入中…</span><span id="zone">HKT</span></div>
<script>
(() => {
  'use strict';
  const clock = document.getElementById('clock');
  const label = document.getElementById('clock-text');
  const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const dateFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Hong_Kong', year: 'numeric', month: 'numeric', day: 'numeric' });
  const timeFmt = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Hong_Kong', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let lastDate = '';

  function fit() {
    const width = Math.max(100, document.documentElement.clientWidth - 12);
    const style = getComputedStyle(clock);
    const family = style.fontFamily;
    const weight = style.fontWeight;
    // Measure a single uninterrupted line. Avoid flex/max-content/ResizeObserver feedback loops.
    ctx.font = `${weight} 100px ${family}`;
    const mainWidth = ctx.measureText(label.textContent).width;
    ctx.font = `500 28px ${family}`;
    const zoneWidth = ctx.measureText('HKT').width + 20;
    const requiredAt100 = mainWidth + zoneWidth;
    const size = Math.min(140, Math.max(12, 100 * width / Math.max(requiredAt100, 1)));
    clock.style.fontSize = size.toFixed(2) + 'px';
  }

  function update() {
    const now = new Date();
    const parts = Object.fromEntries(dateFmt.formatToParts(now).filter(p => p.type !== 'literal').map(p => [p.type, p.value]));
    const weekday = weekdays[new Date(Date.UTC(+parts.year, +parts.month - 1, +parts.day)).getUTCDay()];
    const date = `${+parts.month} 月 ${+parts.day} 日（${weekday}）`;
    const text = `${date}　${timeFmt.format(now)}`;
    if (label.textContent !== text) {
      label.textContent = text;
      if (date !== lastDate) { fit(); lastDate = date; }
    }
  }

  update();
  window.addEventListener('resize', fit, { passive: true });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  setInterval(update, 250);
})();
</script>
</body>
</html>
